<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ドット絵ペイント</title>

    <!--
      最小限の見た目だけ整えている（Tailwind は使わない）。CSS を足して自由に装飾できる。

      マス目の作り方: flex や grid は使わず、各マス(.pixel-cell)を inline-block で横に並べ、
      コンテナ(.pixel-canvas)の幅を「マス幅 × 16」にして自然に折り返させている。
    -->
    <style>
      body {
        margin: 24px;
        font-family: sans-serif;
        line-height: 1.6;
      }

      /* マス目コンテナ。幅 = 20px × 16マス = 320px。
         font-size: 0 は inline-block の間にできる余白(隙間)を消すため。 */
      /* キャンパスの幅をCANVAS_SIZEで決める(固定)
      　 １辺のマスの個数をGRID_NUMで決める(可変) */
      .pixel-canvas {
        width: CANVAS_SIZE + "px";
        height: CANVAS_SIZE + "px";
        font-size: 0;
        border: 1px solid #999;
        margin: 16px 0;
      }
      /* 1マス。box-sizing: border-box で枠線を含めて 20px にし、ぴったり16列にする。➡変更済み */
      .pixel-cell {
        display: inline-block;
        box-sizing: border-box;
        width: (CANVAS_SIZE / GRID_NUM) + "px";
        height: (CANVAS_SIZE / GRID_NUM) + "px";
        border: 1px solid #eee;
        background: #fff;
        cursor: pointer;
      }

      .controls button {
        padding: 8px 16px;
        font-size: 16px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <h1>ドット絵ペイント</h1>
    <p>マス目を塗ってみましょう。</p>

    <!-- マス目は renderGrid がここに並べる。 -->
    <div id="canvas" class="pixel-canvas"></div>

    <!-- 操作ボタン。クリック時の処理は main.ts で結びつけている。 -->
    <div class="controls">
      <button id="clear-button">全消去</button>
    </div>

    <!-- 筆の太さ変更機能-->
    <div class="controls">
      <button id="brush-size-button" id="brush1">極小(1)</button>
      <button id="brush-size-button" id="brush3">小(3×3)</button>
      <button id="brush-size-button" id="brush5">中(5×5)</button>
      <button id="brush-size-button" id="brush10">大(10×10)</button>
    </div>

    <!-- マスのサイズ変更機能-->
    <div class="controls">
      <button id="grid-num-button" id="grid10">10×10マス</button>
      <button id="grid-num-button" id="grid25">25×25マス(デフォルト)</button>
      <button id="grid-num-button" id="grid50">50×50マス</button>
      <button id="grid-num-button" id="grid100">100×100マス</button>
    </div>

    <!-- 拡張ポイント（ステップ2以降で使う空きエリア）。- カラーパレット → ここに色ボタンを並べる -->

    <!-- TypeScript を読み込む（Vite が変換する）。 -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
